<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="476.42063" height="343.51002" viewBox="0,0,476.42063,343.51002"><g transform="translate(-1.38392,-7.1952)"><g stroke="none" stroke-miterlimit="10"><path d="M257.5865,341.67438v-329h218v329z" fill-opacity="0.50588" fill="#000000" stroke-width="0"/><image x="461.00001" y="72" width="1" height="1" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNhAAIAABkABTcBQksAAAAtdEVYdFNvZnR3YXJlAGJ5LmJsb29kZHkuY3J5cHRvLmltYWdlLlBORzI0RW5jb2RlcqgGf+4AAAAASUVORK5CYII=" fill="#000000" stroke-width="1"/><text transform="translate(267.24156,44.9841) scale(0.52029,0.52029)" font-size="18" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;font0&quot;, Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">1.  Find a tree and click it to get wood </tspan><tspan x="0" dy="20.34px">(collect it)</tspan><tspan x="0" dy="20.34px"> </tspan><tspan x="0" dy="20.34px">2.  Press E to open your inventory and </tspan><tspan x="0" dy="20.34px">drag the wood on to a single space in your</tspan><tspan x="0" dy="20.34px">inventory crafting area.  The result will be </tspan><tspan x="0" dy="20.34px">wooden planks which you can drag </tspan><tspan x="0" dy="20.34px">back into your inventory.</tspan><tspan x="0" dy="20.34px"> </tspan><tspan x="0" dy="20.34px">3.  Now drag those planks back into your</tspan><tspan x="0" dy="20.34px">crafting grid, using [space] to split stacks,</tspan><tspan x="0" dy="20.34px">place a wooden plank in each of the 4 </tspan><tspan x="0" dy="20.34px">crafting spaces to make a crafting table. </tspan><tspan x="0" dy="20.34px">Drag it into your hotbar.</tspan><tspan x="0" dy="20.34px"> </tspan><tspan x="0" dy="20.34px">4.  Press [E] to close your inventory, then </tspan><tspan x="0" dy="20.34px">using the number keys, select the crafting</tspan><tspan x="0" dy="20.34px">table and place it by clicking an empty level </tspan><tspan x="0" dy="20.34px">tile. To open it, hover your mouse </tspan><tspan x="0" dy="20.34px">over it and press [E]. This is where you can</tspan><tspan x="0" dy="20.34px"> craft more blocks, items, tools etc.</tspan><tspan x="0" dy="20.34px"> </tspan><tspan x="0" dy="20.34px">5.  Recipes and mechanics are the same as </tspan><tspan x="0" dy="20.34px">Minecraft, go to minecraft.wiki for more</tspan><tspan x="0" dy="20.34px">information.</tspan></text><text transform="translate(407.78398,326.13201) scale(0.24402,0.24402)" font-size="40" xml:space="preserve" fill="#ffffff" stroke-width="1" font-family="&quot;font0&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Back to title</tspan></text><image x="800.00002" y="637.00002" transform="scale(0.5,0.5)" width="10" height="16" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAQCAYAAAAvf+5AAAAAAXNSR0IArs4c6QAAADNJREFUKFNjZMAD/v///x8mzUh7hcjWIduGYTXlCnGZgO5JxgFUiO4Wyn1NtonIGmmbKAAqxj/RbQUHdAAAAABJRU5ErkJggg==" fill="none" stroke-width="0.5"/><image x="2.49346" y="14.26431" transform="scale(0.55502,0.50442)" width="452" height="681" xlink:href="data:image/png;base64," fill="none" stroke-width="0.5"/><text transform="translate(14.93291,61.39788) scale(0.19648,0.20827)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;font0&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">WASD</tspan><tspan x="0" dy="48px">Click</tspan><tspan x="0" dy="48px">E</tspan><tspan x="0" dy="48px">F + Hold for 2 seconds</tspan><tspan x="0" dy="48px">Space</tspan><tspan x="0" dy="48px">R</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">O</tspan><tspan x="0" dy="48px">P</tspan><tspan x="0" dy="48px">V</tspan><tspan x="0" dy="48px">U</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Z or [SHIFT] + Shield in Offhand slot to use</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">To open crafting table, boat, chest, furnace, </tspan><tspan x="0" dy="48px">minecart, trade with villagers, ride mobs with saddles, etc. </tspan><tspan x="0" dy="48px">put your mouse cursor over it </tspan><tspan x="0" dy="48px">and press E</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Press [SPACE] while in the air to use Elytra</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">[Shift] + Holding Shovel/Axe to make </tspan><tspan x="0" dy="48px">Dirt Path/Stripped Log</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">You can use commands to change Settings - Tap [T]</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Game by ChessProKing-TM, Follow me on Scratch :)</tspan></text><text transform="translate(115.07773,59.55286) scale(0.19985,0.2158)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;font0&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Move, Jump and Crouch/Sneak</tspan><tspan x="0" dy="48px">Dig or place blocks</tspan><tspan x="0" dy="48px">Open inventory or block</tspan><tspan x="0" dy="48px">Eat held item</tspan><tspan x="0" dy="48px">Drop/Split stack while crafting</tspan><tspan x="0" dy="48px">Sprint (R + In water to swim)</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Save current game</tspan><tspan x="0" dy="48px">Pause current game</tspan><tspan x="0" dy="48px">Open Advancements Menu</tspan><tspan x="0" dy="48px">Enter Cape Redeem Code</tspan></text><text transform="translate(16.36073,39.32734) scale(0.48312,0.48312)" font-size="40" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;font0&quot;, Sans Serif" font-weight="normal" text-anchor="start"><tspan x="0" dy="0">Controls</tspan></text></g></g></svg>
.50874z" fill="#b0b0b0" stroke-width="0.79057"/><path d="M110.33375,171.05149h424.50874v12.36999h-424.50874z" fill="#b0b0b0" stroke-width="0.79057"/><path d="M110.33375,197.05149h424.50874v12.36999h-424.50874z" fill="#b0b0b0" stroke-width="0.79057"/><path d="M110.33375,224.55149h424.50874v12.36999h-424.50874z" fill="#b0b0b0" stroke-width="0.79057"/><text transform="translate(113.0788,61.16714) scale(0.58917,0.61442)" font-size="18" xml:space="preserve" fill="#000000" stroke-width="1" font-family="&quot;font0&quot;, Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">/gamerule &lt;gamerule name&gt; &lt;0, or 1&gt;</tspan><tspan x="0" dy="21.6px"> </tspan><tspan x="0" dy="21.6px">Gamerules:</tspan><tspan x="0" dy="21.6px"> AllowWaterInNether  (Allows water in the Nether) </tspan><tspan x="0" dy="21.6px">AllowSleepInNether (Allows sleeping in the Nether)</tspan><tspan x="0" dy="21.6px">KeepInventory (When you die, you keep your inventory)</tspan><tspan x="0" dy="21.6px">MobSpawning (Removes Hostile mobs from spawning)</tspan><tspan x="0" dy="21.6px">MobGriefing (Mobs cannot damage/change the world)</tspan><tspan x="0" dy="21.6px">DisableRaids (Raids are disabled)</tspan><tspan x="0" dy="21.6px">ChristmasChest (Switches the chest costume to the Chrismtas variant)</tspan><tspan x="0" dy="21.6px">DoImmediateRespawn (Respawn automatically when on)</tspan><tspan x="0" dy="21.6px">NoSnowChristmasTime (Turns off infinite snowing while in chrismtas time)</tspan><tspan x="0" dy="21.6px">NoSprinting (Turns sprinting on or off)</tspan><tspan x="0" dy="21.6px">NaturalRegeneration (Turns on or off natural regen)</tspan><tspan x="0" dy="21.6px">DisableCommandChanges (Prevents players from modifying command blocks)</tspan><tspan x="0" dy="21.6px">AlwaysFog (Always turns on fog)</tspan></text></g></svg>